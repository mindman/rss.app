<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:serif;max-width:760px;margin:30px auto;color:purple}h3{color:red!important}img{border:5px solid red}a{color:green}</style></head><body>
<h1>ホストページ（意地悪なCSS入り）</h1>
<p>script 埋め込み:</p>
<script src="/exec?mode=embed&amp;url=https%3A%2F%2Ffx.test%2Frss2.xml&amp;theme=magazine&amp;accent=%23059669" async></script>
<p>ticker:</p>
<script src="/exec?mode=embed&amp;url=https%3A%2F%2Ffx.test%2Fatom.xml&amp;theme=ticker" async></script>
<p>iframe 埋め込み:</p>
<iframe data-rss-widget src="/exec?mode=frame&amp;url=https%3A%2F%2Ffx.test%2Frss2.xml&amp;theme=compact&amp;scheme=dark" style="width:100%;height:100px;border:0;display:block"></iframe>
<script>window.addEventListener("message",function(e){if(!e.data||e.data.type!=="rss-widget:height")return;
document.querySelectorAll("iframe[data-rss-widget]").forEach(function(f){for(var w=e.source,i=0;w&&i<5;i++,w=w.parent){
if(f.contentWindow===w){f.style.height=e.data.height+"px";break;}if(w===w.parent)break;}});});</script>
<p>不正 ID:</p><script src="/exec?mode=embed&amp;id=zzzzzzzz"></script>
<p>end</p></body></html>
